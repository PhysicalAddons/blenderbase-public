name: Sign check

# Manual check of the code-signing paths without building or releasing
# anything. Windows: Azure login through OIDC, SignTool plugin download, a
# signature from the blenderbase-public certificate profile. macOS: the
# Developer ID certificate imports and signs, the App Store Connect API key is
# accepted, and a small signed binary comes back from notarization. It runs on
# its own when the signing files change on any branch, and can be started from
# the Actions tab after changes on the Azure or Apple side.

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/sign-check.yaml"

jobs:
  sign-check:
    name: Windows (Azure Artifact Signing)
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read
    environment: release

    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install signing tools
        shell: pwsh
        run: ./scripts/install-signing-tools.ps1

      # Any PE file will do as a signing target; the point is the round trip
      # to the service and the subject on the resulting signature.
      - name: Sign a sample file
        shell: pwsh
        run: |
          Copy-Item "$env:WINDIR\System32\where.exe" sign-check.exe
          ./scripts/sign-windows.ps1 sign-check.exe

      # Get-AuthenticodeSignature would report the Windows catalog entry for
      # where.exe (the Authenticode hash ignores the signature block, so the
      # catalog still matches), so read the embedded signer certificate.
      - name: Show the signature
        shell: pwsh
        run: |
          $path = (Resolve-Path sign-check.exe).Path
          $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::CreateFromSignedFile($path)
          "Subject: $($cert.Subject)"
          "Issuer:  $($cert.Issuer)"
          "Expires: $($cert.NotAfter)"
          if ($cert.Subject -notlike '*SIA Physical Software*') { throw "Unexpected subject" }

  sign-check-macos:
    name: macOS (Developer ID, notarization)
    runs-on: macos-latest
    permissions:
      contents: read
    # Same environment as the release build, so secrets kept on the
    # environment rather than the repository are visible here too.
    environment: release
    # A team's first notarization can sit in Apple's queue far longer than the
    # usual few minutes; the script gives up after 45.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Import, sign and notarize a probe
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: bash scripts/apple-signing.sh --notarize
