name: Publish Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: true

env:
  IBM_TELEMETRY_DISABLED: "true"
  SQLX_OFFLINE: "true"

jobs:
  publish-tauri:
    name: build (${{ matrix.platform }})
    permissions:
      contents: write
      # The Windows job signs the exe and MSI with Azure Artifact Signing and
      # logs in to Azure with a GitHub OIDC token instead of a stored secret.
      id-token: write
    # Azure trusts tokens whose subject names this environment
    # (repo:PhysicalAddons/blenderbase-public:environment:release).
    environment: release

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            target: aarch64-apple-darwin
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # Windows code signing: Azure Artifact Signing, account and profile in
      # scripts/artifact-signing.json. AZURE_CLIENT_ID / AZURE_TENANT_ID /
      # AZURE_SUBSCRIPTION_ID are repository variables (identifiers, not
      # secrets); the app registration behind AZURE_CLIENT_ID has a federated
      # credential for this repository's `release` environment and the
      # "Artifact Signing Certificate Profile Signer" role on the account.
      - name: Azure login (OIDC)
        if: runner.os == 'Windows'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install signing tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install-signing-tools.ps1

      # Writes the Tauri config overlay that routes bundle.windows.signCommand
      # to scripts/sign-windows.ps1; the path is passed as --config below so
      # plain local builds stay unsigned.
      - name: Enable signing in the Tauri build
        if: runner.os == 'Windows'
        id: signcfg
        shell: pwsh
        run: |
          $cfg = ./scripts/sign-config.ps1
          "config=--config $cfg" >> $env:GITHUB_OUTPUT

      # The release body comes from the CHANGELOG.md section whose heading
      # matches the tag (## 1.2.1 for v1.2.1). Falls back to a pointer at
      # the changelog when no section exists yet.
      - name: Extract release notes
        id: notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          body="$(awk -v v="$version" '
            $0 ~ "^## " { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md)"
          if [ -z "$(printf "%s" "$body" | tr -d "[:space:]")" ]; then
            body="See CHANGELOG.md for details."
          fi
          # Direct links to the three installers go first, so nobody has to
          # pick them out of the asset list (the rest of which serves the
          # in-app updater).
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          # Every line of this string must stay indented under the `run: |`
          # block, or YAML ends the block early and the workflow is invalid.
          downloads="$(printf '%s\n' \
            "## Download" \
            "- **Windows:** [Blenderbase_${version}_x64_en-US.msi](${base}/Blenderbase_${version}_x64_en-US.msi)" \
            "- **macOS (Apple Silicon):** [Blenderbase_${version}_aarch64.dmg](${base}/Blenderbase_${version}_aarch64.dmg)" \
            "- **Linux:** [Blenderbase_${version}_amd64.AppImage](${base}/Blenderbase_${version}_amd64.AppImage)" \
            "" \
            "The remaining files are used by Blenderbase to update itself." \
            "" \
            "## Changes")"
          {
            echo "body<<NOTES_EOF"
            printf '%s\n\n%s\n' "$downloads" "$body"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      # All three jobs upload into the same draft release, matched by tag.
      - name: Build and create GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri 2 reads TAURI_SIGNING_PRIVATE_KEY; the repository may still
          # carry the key under the Tauri 1 name, so accept either.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Blenderbase v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          # Publishes latest.json plus the signed updater bundles. Signed with
          # the key generated on 2026-09-13 (id 67037EBA3C3109B6); its private
          # half must be in the TAURI_SIGNING_PRIVATE_KEY secret. Installs older
          # than 1.2.0 were signed with a key that is no longer available and
          # update by hand once.
          includeUpdaterJson: true
          args: ${{ matrix.args }} ${{ steps.signcfg.outputs.config }}
