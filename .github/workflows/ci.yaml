name: CI

on:
  pull_request:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"

env:
  IBM_TELEMETRY_DISABLED: "true"
  SQLX_OFFLINE: "true"

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # Tauri's Linux build needs WebKitGTK and friends at compile time.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run typecheck

      # tauri-build verifies that frontendDist (dist/) exists, so create a stub
      # before any cargo step compiles the crate.
      - name: Create frontend dist stub
        shell: bash
        run: |
          mkdir -p dist
          echo "<!doctype html>" > dist/index.html

      - name: cargo fmt
        working-directory: src-tauri
        continue-on-error: true # codebase is not yet formatted
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: src-tauri
        continue-on-error: true # existing warnings; tighten once clean
        run: cargo clippy --no-deps -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --lib
